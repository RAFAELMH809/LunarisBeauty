{% load static %}
<article class="card">
  <button class="wish" aria-label="Favorito">♡</button>

  <div class="thumb">
    <img src="{% static image_url %}" alt="{{ name }}">
  </div>

  <div class="card-body">
    <h3 class="card-title">{{ name }}</h3>
    {% if subtitle %}<p class="card-sub">{{ subtitle }}</p>{% endif %}
    <p class="card-price">${{ price }}</p>

    <!-- Botón con data-* para poblar el modal -->
    <button
      class="btn btn-primary btn-cart"
      data-action="add-to-cart"
      data-name="{{ name }}"
      data-price="{{ price }}"
      data-image="{% static image_url %}"
      data-url="#"
    >
      Agregar al carrito
    </button>
  </div>
</article>
